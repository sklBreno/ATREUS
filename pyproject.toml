[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atreus"
version = "0.1.0-alpha"
description = "Adaptive Personal Intelligence Platform"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "ruff>=0.8",
]
ai-openai = [
    "openai>=2.0,<3",
]

[project.scripts]
atreus = "atreus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
